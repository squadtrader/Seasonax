name: Mise à jour des données

on:
  schedule:
    - cron: "30 23 * * *"   # tous les jours à 23h30 UTC
  workflow_dispatch:         # permet de le lancer à la main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Calculer la saisonnalité
        run: python scripts/update_data.py

      - name: Enregistrer les résultats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Mise à jour des données $(date -u +%F)"
            git push
          fi
